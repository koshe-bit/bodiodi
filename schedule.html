  <style>
    main{ padding-top:96px; }

    .schedule-wrap{
      width: min(640px, 100%);
      margin-left: 0;
      margin-right: auto;
    }

    .page-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }

    .kicker{
      margin:0 0 6px 0;
      font-family:"Inter";
      letter-spacing:.12em;
      text-transform:uppercase;
      font-weight:800;
      color:var(--dk85);
      opacity:.9;
      font-size:12px;
    }

    .meta{
      margin:4px 0 0 0;
      font-size:14px;
      opacity:.9;
    }

    .weekline{
      margin:6px 0 0 0;
      font-size:14px;
      color:var(--dk85);
      opacity:.95;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
      margin-top:18px;
      width:100%;
    }

    .card{
      width:100%;
      border:1px solid rgba(0,0,0,.10);
      border-radius:16px;
      padding:16px 18px 14px;
      background:rgba(255,255,255,.72);
      box-shadow:0 10px 24px rgba(0,0,0,.06);
    }

    .card h3{
      margin:0 0 6px 0;
      font-family:"Inter";
      font-weight:800;
      letter-spacing:-.01em;
      color:var(--dk);
      font-size:22px;
      line-height:1.05;
    }

    .when{
      margin:0 0 10px 0;
      font-size:14px;
      color:var(--dk85);
      opacity:.92;
    }

    .classline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 0;
      border-top:1px solid rgba(0,0,0,.08);
    }
    .classline:first-of-type{
      border-top:0;
      padding-top:4px;
    }

    .classname{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }

    .classname button{
      all:unset;
      cursor:pointer;
      display:inline-block;
      max-width:100%;
    }

    .classname button strong{
      font-family:"Inter";
      font-weight:800;
      letter-spacing:-.01em;
      color:var(--dk);
      font-size:15px;
      line-height:1.1;
      text-decoration:underline;
      text-underline-offset: 2px;
      text-decoration-thickness: 1px;
    }
    .classname button:hover strong{ opacity:.85; }

    .classname span{
      font-size:13px;
      color:var(--dk85);
      opacity:.92;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .btn.small{
      padding:10px 14px;
      letter-spacing:.10em;
      font-size:12px;
      white-space:nowrap;
    }

    .retry-banner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border:1px solid rgba(0,0,0,.10);
      border-radius:16px;
      padding:14px 16px;
      background:rgba(255,240,235,.85);
      box-shadow:0 10px 24px rgba(0,0,0,.06);
      margin-bottom:16px;
    }
    .retry-banner p{
      margin:0;
      font-size:14px;
      color:var(--dk);
    }
    .retry-banner button{
      all:unset;
      cursor:pointer;
      padding:8px 14px;
      border-radius:999px;
      border:2px solid rgba(58,67,60,.35);
      font-family:"Inter";
      font-weight:800;
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--dk);
      white-space:nowrap;
    }
    .retry-banner button:hover{ opacity:.85; }

    .modal{ position:fixed; inset:0; display:none; z-index:250; }
    .modal.open{ display:block; }
    .modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.45); }
    .modal-card{
      position:relative;
      width:min(640px, 92vw);
      margin: 12vh auto 0;
      background:#fffaf8;
      border:1px solid rgba(0,0,0,.08);
      border-radius:16px;
      padding:18px 18px 14px;
      box-shadow:0 18px 40px rgba(0,0,0,.22);
      color:var(--dk);
      font-family:"Krub", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .modal-card h3{
      margin:0 0 8px 0;
      font-family:"Inter";
      font-weight:800;
      letter-spacing:-.01em;
      color:var(--dk);
    }
    .modal-body p{
      margin:0 0 10px 0;
      line-height:1.5;
      max-width:none;
      font-size:14px;
      opacity:.95;
    }
    .modal-actions{
      display:flex; gap:10px; justify-content:flex-end;
      margin-top:12px;
    }
    .btn-ghost{
      background:transparent;
      border:2px solid rgba(58,67,60,.35);
      color:var(--dk85);
    }
    .modal-note{
      margin:10px 0 0 0;
      font-size:13px;
      opacity:.82;
    }

  <main>
    <div class="schedule-wrap">

      <div class="page-head">
        <div>
          <p class="kicker">Schedule</p>
          <h1 style="margin:0;">Class Schedule</h1>
          <p class="meta">More classes coming soon, be sure to check back.</p>
          <p class="weekline" id="weekLine"></p>
        </div>
        <div></div>
      </div>

      <div class="rule" aria-hidden="true"></div>

      <div class="retry-banner" id="retryBanner" style="display:none;">
        <p>Having trouble loading the schedule. Your connection or our server may be slow right now.</p>
        <button type="button" id="retryBtn">Retry</button>
      </div>

      <section class="grid" id="dayGrid" aria-label="Weekly schedule"></section>

      <p style="margin-top:12px;">
        <a class="btn" href="index.html">Back to home</a>
      </p>

    </div>
  </main>

  <div class="modal" id="descModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="descTitle">
    <div class="modal-backdrop" data-close="1"></div>

    <div class="modal-card">
      <h3 id="descTitle">Class description</h3>
      <div class="modal-body" id="descBody">
        <p>Loading…</p>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" id="closeDesc">Close</button>
      </div>
    </div>
  </div>

  <script src="assets/site.js?v=2"></script>

  <script>
    const TZ = 'America/Detroit';

    const EMPTY_NOTE = 'No classes at this time, check back later';

    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyHqHeUS--cfAxGkbsD179aB8rhnTptirrAUZkp0BjXo5Ve7GY3GqOYKECngU0d1bFKHQ/exec';

    const FETCH_TIMEOUT_MS = 8000;

    /* Week rolls over Sunday at 1:00 AM (America/Detroit) instead of Monday midnight */
    const WEEK_CUTOVER_HOUR = 1;

    function weekdayNumFromName(name){
      const n = String(name||'').trim().toLowerCase();
      return { monday:1, tuesday:2, wednesday:3, thursday:4, friday:5, saturday:6, sunday:7 }[n] || null;
    }

    function formatTimeFromISO(iso){
      if (!iso) return '';
      const d = new Date(iso);
      return new Intl.DateTimeFormat('en-US', {
        timeZone: TZ,
        hour: 'numeric',
        minute: '2-digit'
      }).format(d);
    }

    async function fetchWithTimeout(url, options, timeoutMs){
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try{
        const res = await fetch(url, { ...options, signal: controller.signal });
        return res;
      } finally {
        clearTimeout(timer);
      }
    }

    async function loadWeekTemplateFromBackend(){
      const url = `${BACKEND_URL}?action=schedule`;
      const res = await fetchWithTimeout(url, { cache: 'no-cache' }, FETCH_TIMEOUT_MS);
      if (!res.ok) throw new Error('Schedule API failed.');
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Schedule API returned ok:false');

      // Keyed by ISO weekday number: Monday=1 ... Sunday=7 (matches backend's classId scheme)
      const buckets = new Map();
      for (const r of (data.rows || [])){
        const wnum = weekdayNumFromName(r.weekday);
        if (!wnum) continue;

        const start = formatTimeFromISO(r.start);
        const end   = formatTimeFromISO(r.end);
        const time  = (start && end) ? `${start}–${end}` : '';

        if (!buckets.has(wnum)) buckets.set(wnum, []);
        buckets.get(wnum).push({
          name: r.className,
          time,
          instructor: r.instructor || ''
        });
      }

      return buckets; // Map: weekdayNum (Mon=1...Sun=7) -> classes[]
    }

    function zonedParts(date){
      const parts = new Intl.DateTimeFormat('en-US',{
        timeZone:TZ, year:'numeric', month:'numeric', day:'numeric', hour:'numeric', hour12:false
      }).formatToParts(date);
      return Object.fromEntries(parts.map(p=>[p.type,p.value]));
    }

    // Returns ISO weekday number: Monday=1 ... Sunday=7 (in TZ)
    function weekdayNum(date){
      const wd = new Intl.DateTimeFormat('en-US',{ timeZone:TZ, weekday:'short' }).format(date).toLowerCase();
      return { mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sun:7 }[wd];
    }

    function utcNoon(y,m,d){ return new Date(Date.UTC(y,m-1,d,12)); }
    function addDays(d,n){ return new Date(d.getTime()+n*86400000); }

    function formatDay(date){
      const w = new Intl.DateTimeFormat('en-US',{ timeZone:TZ, weekday:'long' }).format(date);
      const md = new Intl.DateTimeFormat('en-US',{ timeZone:TZ, month:'short', day:'numeric' }).format(date);
      return `${w} | ${md}`;
    }

    /**
     * Builds the 7-day week, Sunday first.
     * WEEK START: Sunday at 1:00 AM (America/Detroit). Before 1:00 AM on Sunday,
     * this still returns the PREVIOUS week — matches the backend's cutover exactly.
     * Each day also carries wdNum (Mon=1...Sun=7) to match backend's weekday-keyed buckets.
     */
    function buildWeek(){
      const now = new Date();
      const p = zonedParts(now);
      let today = utcNoon(+p.year, +p.month, +p.day);
      const hour = p.hour === '24' ? 0 : +p.hour;
      let wd = weekdayNum(now); // Mon=1...Sun=7

      // If it's Sunday before 1:00 AM, the new week hasn't started yet —
      // treat "today" as still Saturday of the previous week for anchoring.
      if (wd === 7 && hour < WEEK_CUTOVER_HOUR) {
        today = addDays(today, -1);
        wd = 6; // Saturday
      }

      // Anchor = the Sunday that starts this week (wd % 7: Sun(7)->0, Mon(1)->1, ... Sat(6)->6)
      const sunday = addDays(today, -(wd % 7));

      document.getElementById('weekLine').textContent =
        `Week of ${new Intl.DateTimeFormat('en-US',{ timeZone:TZ, month:'short', day:'numeric' }).format(sunday)}`;

      // i=0 -> Sunday ... i=6 -> Saturday
      return Array.from({length:7}, (_,i) => {
        const date = addDays(sunday, i);
        return { date, header: formatDay(date), wdNum: weekdayNum(date) };
      });
    }

    // ---- Modal + description loading from classes.html ----
    const descModal = document.getElementById('descModal');
    const descBody  = document.getElementById('descBody');
    const descTitle = document.getElementById('descTitle');
    const closeDesc = document.getElementById('closeDesc');

    let classDescCache = null;

    function openDescModal(title, html){
      descTitle.textContent = title;
      descBody.innerHTML = html;
      descModal.classList.add('open');
      descModal.setAttribute('aria-hidden','false');
    }

    function closeDescModal(){
      descModal.classList.remove('open');
      descModal.setAttribute('aria-hidden','true');
    }

    descModal.addEventListener('click', (e) => {
      if (e.target && e.target.dataset && e.target.dataset.close) closeDescModal();
    });
    closeDesc.addEventListener('click', closeDescModal);

    async function loadDescriptions(){
      if (classDescCache) return classDescCache;

      const res = await fetchWithTimeout('https://bodiodi.com/classes.html', { cache: 'no-cache' }, FETCH_TIMEOUT_MS);
      if (!res.ok) throw new Error('Could not load class descriptions.');
      const html = await res.text();

      const doc = new DOMParser().parseFromString(html, 'text/html');
      const sections = {};

      const h2s = Array.from(doc.querySelectorAll('h2'));
      h2s.forEach((h2, i) => {
        const name = (h2.textContent || '').trim();
        const nodes = [];
        let el = h2.nextElementSibling;
        while (el && el.tagName.toLowerCase() !== 'h2') {
          nodes.push(el);
          el = el.nextElementSibling;
        }
        const cleaned = nodes
          .filter(n => n.textContent && n.textContent.trim().length)
          .map(n => `<p>${escapeHtml_(n.textContent.trim())}</p>`)
          .join('');
        sections[name.toLowerCase()] = cleaned || '<p>Description coming soon.</p>';
      });

      classDescCache = sections;
      return sections;
    }

    function escapeHtml_(s){
      return s
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;');
    }

    async function showClassDescription(className){
      try{
        openDescModal(className, '<p>Loading…</p>');
        const map = await loadDescriptions();
        const key = String(className || '').toLowerCase();
        const html = map[key] || '<p>Description coming soon.</p>';
        openDescModal(className, html);
      } catch (e){
        openDescModal(className, '<p>Could not load the class description. Please try again.</p>');
        console.error(e);
      }
    }

    const retryBanner = document.getElementById('retryBanner');
    const retryBtn = document.getElementById('retryBtn');
    retryBtn.addEventListener('click', () => {
      retryBanner.style.display = 'none';
      render();
    });

    async function render(){
      const grid = document.getElementById('dayGrid');

      grid.innerHTML = `
        <article class="card">
          <h3>Loading…</h3>
          <p class="when">Fetching this week's schedule.</p>
        </article>
      `;
      retryBanner.style.display = 'none';

      let buckets; // Map: weekdayNum (Mon=1...Sun=7) -> classes[]
      let failed = false;
      try{
        buckets = await loadWeekTemplateFromBackend();
      } catch(e){
        console.error(e);
        failed = true;
        buckets = new Map();
      }

      grid.innerHTML = '';

      if (failed){
        retryBanner.style.display = 'flex';
      }

      const week = buildWeek(); // Sunday-first array, each day carries wdNum (Mon=1...Sun=7)

      const merged = week.map(d => ({
        ...d,
        classes: buckets.get(d.wdNum) || []
      }));

      merged.forEach(day=>{
        day.classes.sort((a, b) => {
          const parse = str => {
            const m = String(str || '').toLowerCase().replace(/\s/g,'').match(/^(\d{1,2})(?::(\d{2}))?([ap])$/);
            if (!m) return 0;
            let hh = parseInt(m[1], 10);
            const mm = m[2] ? parseInt(m[2], 10) : 0;
            if (m[3] === 'p' && hh !== 12) hh += 12;
            if (m[3] === 'a' && hh === 12) hh = 0;
            return hh * 60 + mm;
          };
          const startA = String(a.time || '').split('–')[0];
          const startB = String(b.time || '').split('–')[0];
          return parse(startA) - parse(startB);
        });

        const card=document.createElement('article');
        card.className='card';
        const has=day.classes.length>0;

        card.innerHTML=`
          <h3>${day.header}</h3>
          <p class="when">${has?'':EMPTY_NOTE}</p>
          <div class="day-lines"></div>
        `;

        const lines=card.querySelector('.day-lines');
        if(has){
          day.classes.forEach(c=>{
            const line=document.createElement('div');
            line.className='classline';
            line.innerHTML=`
              <div class="classname">
                <button type="button" aria-label="View description for ${c.name}">
                  <strong>${c.name}</strong>
                </button>
                <span>${c.time} with ${c.instructor}</span>
              </div>
            `;

            line.querySelector('button').addEventListener('click', () => {
              showClassDescription(c.name);
            });

            lines.appendChild(line);
          });
        }
        grid.appendChild(card);
      });
    }

    render();
  </script>
</body>
